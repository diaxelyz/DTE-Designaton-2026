<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NeuroHalo</title>
<script>
  /* On a laptop, start with the phone app. "Open website" adds ?app=1 for the full-size version. */
  if (window.top === window.self && !/[?&]app=1/.test(location.search) && matchMedia('(min-width: 900px)').matches)
    location.replace('/device.html' + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./style.css">
<script src="./qrcode.js"></script>
<script src="./phone.js"></script>
<script type="module" src="./app.js"></script>
</head>
<body>
  <header id="top"></header>
  <main id="app"></main>
  <nav id="tabs" aria-label="Main"></nav>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
